name: CI/CD

on:
  push:
    branches: [main, claude/modeltrack-build-QwruL]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        flake8 modeltrack tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 modeltrack tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: black --check modeltrack tests dashboards examples || true

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=modeltrack --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -f docker/Dockerfile -t modeltrack:latest .

    - name: Test Docker image
      run: docker run --rm modeltrack:latest python -m pytest tests/ -q
